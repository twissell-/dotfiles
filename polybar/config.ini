[colors]
background = #222235
background-alt = #222235
foreground = #C5C8C6
primary = #673888
secondary = #F0C674
alert = #FF5555
success = #5BFF55
disabled = #707880

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 23pt
radius = 0

; Put the bar at the bottom of the screen
bottom = true

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace:style=Regular:size=11;2
font-1 = DroidSansM Nerd Font:style=Regular:size=11;2

modules-left = xworkspaces
modules-right = clockify clockify-objective work-vpn screensaver bluetooth muted pulseaudio wlan eth battery filesystem memory cpu date systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 2px
tray-spacing = 2px

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted =   %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "  "
; format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
; format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
; format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery]
type = internal/battery

full-at = 99
low-at = 15

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

poll-interval = 5

time-format = %H:%M

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <animation-low> <label-low>
format-low-underline = ${colors.alert}

label-charging = %percentage%% %time%
label-discharging = %percentage%% %time%

label-full = %percentage%%
label-low = %percentage%% %time%%
lable-low-foreground  = ${colors.alert}

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹

; Only applies if <animation-charging> is used
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
animation-charging-framerate = 300

; Only applies if <animation-discharging> is used
animation-discharging-0 = 󰁹
animation-discharging-1 = 󰂂
animation-discharging-2 = 󰂁
animation-discharging-3 = 󰂀
animation-discharging-4 = 󰁿
animation-discharging-5 = 󰁾
animation-discharging-6 = 󰁽
animation-discharging-7 = 󰁼
animation-discharging-8 = 󰁻
animation-discharging-9 = 󰁺
animation-discharging-framerate = 500

; Only applies if <animation-low> is used
animation-low-0 = %{F#FF5555}󰂃%{F-}
animation-low-1 = " "
animation-low-framerate = 200


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
accumulate-stats = true
speed-unit = ""

[module/wlan]
inherit = network-base
interface-type = wireless
interface = "wlp0s20f3"
label-connected = %{A1:$HOME/bin/dotfiles/i3/scripts/rofi-wifi.sh:}  %essid% %signal%%%{A}
label-disconnected = %{A1:$HOME/bin/dotfiles/i3/scripts/rofi-wifi.sh:}  OFF%{A}
; label-connected = %{F#F0C674} %{F-} %essid%  %upspeed:6%  %downspeed:6%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = " "
; label-connected = %{F#F0C674} %{F-} %local_ip%  %upspeed:6%  %downspeed:6%

[module/date]
type = custom/script
exec = ${HOME}/bin/dotfiles/polybar/scripts/time UTC America/Argentina/Buenos_Aires

[module/muted]
type = custom/script
exec = ${HOME}/bin/dotfiles/polybar/scripts/muted
interval = 1
padding = 1
format-foreground = ${colors.alert}

[module/clockify]
type = custom/script
exec = ${HOME}/bin/dotfiles/polybar/scripts/clockify
interval = 1
padding = 1

[module/clockify-objective]
type = custom/script
exec = ${HOME}/bin/dotfiles/polybar/scripts/clockify-objective
interval = 10
padding = 1

label = %{A1:clockify & disown:}%output%%{A}
label-fail = %{A1:clockify & disown:}%output%%{A}

format-fail = <label-fail>
format-fail-foreground = ${colors.alert}

[module/bluetooth]
type = custom/script
exec = ${HOME}/bin/dotfiles/i3/scripts/rofi-bluetooth.sh --status
padding = 1

label = %{A1:$HOME//bin/dotfiles/i3/scripts/rofi-bluetooth.sh:}%output%%{A}
label-fail = %{A1:$HOME//bin/dotfiles/i3/scripts/rofi-bluetooth.sh:}%output%%{A}

format-fail = <label-fail>
format-fail-foreground = ${colors.alert}


[module/screensaver]
type = custom/script
exec = ${HOME}/bin/dotfiles/polybar/scripts/screensaver-toggle --status
interval = 1
padding = 1

label = %{A1:$HOME/bin/dotfiles/polybar/scripts/screensaver-toggle:}%output%%{A}


[module/work-vpn]
type = custom/script
exec = ${HOME}/bin/dotfiles/polybar/scripts/work-vpn
interval = 5
padding = 1

; label = %{A1:$HOME/bin/dotfiles/polybar/scripts/work-vpn:}%output%%{A}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
